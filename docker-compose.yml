services:
  postgres:
    image: postgres:16-alpine
    container_name: mashjid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mashjid_hisab}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mashjid_hisab}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mashjid-network

  backend:
    build:
      context: ./mashjid-hisab-backend
      dockerfile: Dockerfile
    container_name: mashjid-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      APP_URL: ${APP_URL:-http://localhost:5000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/mashjid_hisab?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-c8e9b01234567890abcdef01234567890abcdef01234567890abcdef01234567}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-d9f0a1234567890abcdef01234567890abcdef01234567890abcdef01234567}
      JWT_SECRET: ${JWT_SECRET:-ea01b234567890abcdef01234567890abcdef01234567890abcdef01234567}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_ACCESS_EXPIRES_IN_MS: 900000
      JWT_REFRESH_EXPIRES_IN_MS: 604800000
      BCRYPT_ROUNDS: 12
      EMAIL_VERIFY_TOKEN_TTL_MS: 86400000
      PASSWORD_RESET_TOKEN_TTL_MS: 3600000
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - mashjid-network

  frontend:
    build:
      context: ./mashjid-hisab-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: mashjid-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:3000"
    networks:
      - mashjid-network

volumes:
  postgres_data:
    name: mashjid-postgres-data
  backend_uploads:
    name: mashjid-backend-uploads

networks:
  mashjid-network:
    name: mashjid-network
    driver: bridge
